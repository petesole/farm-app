name: Stock V2 web build
on:
  push:
    branches:
      - feature/stock-v2-spray-planning-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: TypeScript and web compilation
        id: compile
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/stock-v2-build.log 2>&1
          tsc_status=$?
          if [ "$tsc_status" -eq 0 ]; then
            npx expo export --platform web >> /tmp/stock-v2-build.log 2>&1
            build_status=$?
          else
            build_status=0
          fi
          cat /tmp/stock-v2-build.log
          if [ "$tsc_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then exit 1; fi
      - name: Write failing errors to draft validation PR
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f /tmp/stock-v2-build.log ]; then
            {
              printf 'Stock V2 build failure on commit %s\n\n' "${GITHUB_SHA:0:7}"
              printf '\`\`\`text\n'
              grep -E 'error TS[0-9]+|Error:|npm ERR!|error:' /tmp/stock-v2-build.log | head -70 || tail -35 /tmp/stock-v2-build.log
              printf '\n\`\`\`\n'
            } > /tmp/stock-v2-comment.md
            gh pr comment 7 --body-file /tmp/stock-v2-comment.md
          fi
      - name: Confirm passing build on draft validation PR
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 7 --body "Stock V2 TypeScript and Expo web build PASSED on commit ${GITHUB_SHA:0:7}."
