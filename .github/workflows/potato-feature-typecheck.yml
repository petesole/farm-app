name: Potato module TypeScript check
on:
  pull_request:
    paths:
      - 'app/(tabs)/potato-market.tsx'
      - '.github/workflows/potato-feature-typecheck.yml'
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
