name: Stock V2 Typecheck and Web Build
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript (full repository, legacy errors tracked)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Expo Web Export
        run: npm run build:web
