name: Stock V2 Typecheck and Web Build
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript Stock V2 gate (unrelated legacy errors reported)
        run: |
          npx tsc --noEmit 2>&1 | tee /tmp/jspl-typescript.log || true
          if grep -E '^(app/\\(tabs\\)/home/stock-v2-|components/jspl/|utils/jspl-input)' /tmp/jspl-typescript.log; then
            echo 'Stock V2 or shared UI has TypeScript errors'
            exit 1
          fi
          echo 'No Stock V2 or shared UI TypeScript errors'
      - name: Expo Web Export
        run: npm run build:web
